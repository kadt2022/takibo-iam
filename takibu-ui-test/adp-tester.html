<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Takibu ADP Tester</title>
    <style>
        body {
            background: #050712;
            color: #f5f5f5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
        }
        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }
        h1 {
            margin-top: 0;
            font-size: 26px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 999px;
            background: #111827;
            border: 1px solid #1f2937;
            font-size: 12px;
        }
        .card {
            background: #020617;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1f2937;
            margin-bottom: 16px;
        }
        label {
            font-size: 14px;
            display: block;
            margin-bottom: 4px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #020617;
            color: #f9fafb;
            box-sizing: border-box;
        }
        .row {
            display: flex;
            gap: 16px;
        }
        .row > div {
            flex: 1;
        }
        button {
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            background: #2563eb;
            color: white;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }
        button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .options {
            margin-top: 12px;
            font-size: 13px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .result-box {
            background: #020617;
            border-radius: 12px;
            border: 1px solid #1f2937;
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 12px;
            max-height: 280px;
            overflow: auto;
            white-space: pre-wrap;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .status-ok { color: #22c55e; }
        .status-error { color: #f97316; }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <h1>Takibu ADP Tester</h1>
        <div class="badge" id="timezoneBadge">Timezone: loading…</div>
    </div>

    <div class="card">
        <div class="row">
            <div>
                <label for="baseUrl">Base URL</label>
                <input id="baseUrl" type="text" value="http://localhost:8081">
            </div>
            <div>
                <label for="spaceId">Space ID</label>
                <input id="spaceId" type="text" value="453b218b-86eb-4958-8600-087786d45d00">
            </div>
        </div>

        <div style="margin-top: 12px;">
            <label for="token">Bearer token (JWT)</label>
            <input id="token" type="password" placeholder="dev-org-admin">
        </div>

        <div class="options">
            <label>
                <input type="checkbox" id="reuseDevice" checked>
                Réutiliser le même device (cookie T-Device-Id)
            </label>
            <label>
                <input type="checkbox" id="showPayload" checked>
                Afficher le payload envoyé
            </label>
        </div>

        <div style="margin-top: 16px; display:flex; justify-content:flex-end;">
            <button id="createUserBtn">Créer un utilisateur simulé</button>
        </div>
    </div>

    <div class="card">
        <div class="result-header">
            <span>Résultat</span>
            <span id="statusLabel"></span>
        </div>
        <div id="result" class="result-box"></div>
    </div>
</div>

<script>
    function getOrCreateDeviceId() {
        const name = "T-Device-Id=";
        const decodedCookie = decodeURIComponent(document.cookie || "");
        const parts = decodedCookie.split(';');
        for (let p of parts) {
            p = p.trim();
            if (p.startsWith(name)) {
                return p.substring(name.length);
            }
        }
        const id = crypto.randomUUID();
        document.cookie = "T-Device-Id=" + id + "; path=/; max-age=31536000";
        return id;
    }

    function updateTimezone() {
        try {
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            document.getElementById("timezoneBadge").innerText = "Timezone: " + tz;
        } catch (e) {
            document.getElementById("timezoneBadge").innerText = "Timezone: unknown";
        }
    }

    async function createSimulatedUser() {
        const btn = document.getElementById("createUserBtn");
        const resultEl = document.getElementById("result");
        const statusLabel = document.getElementById("statusLabel");

        const baseUrl = document.getElementById("baseUrl").value.trim();
        const spaceId = document.getElementById("spaceId").value.trim();
        const token = document.getElementById("token").value.trim() || "dev-org-admin";
        const reuseDevice = document.getElementById("reuseDevice").checked;
        const showPayload = document.getElementById("showPayload").checked;

        resultEl.textContent = "";
        statusLabel.textContent = "";
        btn.disabled = true;
        btn.textContent = "Envoi…";

        try {
            const deviceId = reuseDevice ? getOrCreateDeviceId() : crypto.randomUUID();
            const timestamp = Date.now();
            const randomSuffix = Math.floor(Math.random() * 100000);

            const username = "pirate_" + timestamp + "_" + randomSuffix;
            const email = username + "@takibu.test";

            const payload = {
                accountId: null,
                email: email,
                rawPassword: "InitPass123!",
                username: username,
                firstName: "Sophie",
                lastName: "Lemoine",
                initialAssignments: null,
                metadata: null
            };

            const url = baseUrl.replace(/\/+$/, "") + "/api/spaces/" + spaceId + "/users";

            const headers = {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token,
                "X-Device-Id": deviceId
            };

            const options = {
                method: "POST",
                headers: headers,
                body: JSON.stringify(payload)
            };

            console.log("[ADP-TEST] Request", url, options);

            const resp = await fetch(url, options);
            const text = await resp.text();
            let json;
            try {
                json = JSON.parse(text);
            } catch (e) {
                json = { raw: text };
            }

            statusLabel.textContent = "HTTP " + resp.status;
            statusLabel.className = resp.ok ? "status-ok" : "status-error";

            let display = "";
            if (showPayload) {
                display += "=== Request ===\n";
                display += "POST " + url + "\n";
                display += "Headers:\n";
                for (const [k, v] of Object.entries(headers)) {
                    display += "  " + k + ": " + v + "\n";
                }
                display += "\nBody:\n" + JSON.stringify(payload, null, 2) + "\n\n";
            }

            display += "=== Response ===\n";
            display += JSON.stringify(json, null, 2);

            resultEl.textContent = display;
        } catch (e) {
            console.error("[ADP-TEST] Error", e);
            statusLabel.textContent = "Erreur JS (voir console)";
            statusLabel.className = "status-error";
            resultEl.textContent = String(e);
        } finally {
            btn.disabled = false;
            btn.textContent = "Créer un utilisateur simulé";
        }
    }

    // branchement du bouton
    document.getElementById("createUserBtn").addEventListener("click", createSimulatedUser);
    updateTimezone();
</script>
</body>
</html>
