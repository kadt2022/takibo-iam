server:
  port: 8080

spring:
  application:
    name: takibo-adp-test

logging:
  level:
    com.takibo.adp: DEBUG
    com.takibo.adp.core.engine: DEBUG
    com.takibo.adp.spring: DEBUG
    com.takibo.adp.test: INFO

takibo:
  adp:
    enabled: true
    timeout-ms: 20
    parallelism: 8
    policy-version: "1.0"
    
    features:
      baseline: true
      velocity: true
      thresholds: true
      uncertainty: true
      location: true
      network: true
      time: false
    
    profile:
      writer: NOOP
      async-queue-size: 1000
      async-batch-size: 50
