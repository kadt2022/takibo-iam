version: 2

# Mises à jour proposées en PR, soumises aux mêmes portes CI que tout le reste. Les correctifs
# de sécurité arrivent sans attendre ; les montées mineures et correctives sont regroupées
# chaque semaine pour limiter le bruit. Les versions majeures restent des PR séparées.
updates:
  - package-ecosystem: npm
    directory: /takibo-ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      takibo-ui-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types: [minor, patch]
