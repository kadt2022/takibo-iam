name: Takibo UI CI

# CI frontend (chaîne Node). La CI backend vit dans takibo-ci.yml.
#
# - push : le filtre `paths` ne démarre la CI que pour une modification de takibo-ui/.
# - pull_request : `main` exige la vérification « Takibo UI CI Status ». Un filtre au
#   déclencheur empêcherait le workflow de démarrer, et la PR resterait bloquée en attente
#   d'un statut qui n'arrive jamais. La tâche `changes` détecte donc le lot sans impact
#   frontend : la chaîne est écartée, mais « Takibo UI CI Status » s'exécute toujours et
#   rend son verdict.
on:
  push:
    branches: [main, develop]
    paths:
      - 'takibo-ui/**'
      - '.github/workflows/takibo-ui-ci.yml'
  pull_request:
    branches: [main, develop]

concurrency:
  group: takibo-ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Takibo UI Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ui: ${{ steps.detect.outputs.ui }}
      backend: ${{ steps.detect.outputs.backend }}

    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Detect UI changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # push : le déclencheur a déjà écarté les lots sans frontend. Le même push lance
          # la CI backend, dont l'assemblage embarque l'UI : le packaging n'est pas répété.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEAD est le commit de fusion de la PR dans sa base : HEAD^1 est la base.
          changed="$(git -c core.quotepath=off diff --no-renames --name-only HEAD^1 HEAD)"
          printf 'Fichiers modifiés :\n%s\n' "$changed"

          # `ui` (chaîne frontend Node) : takibo-ui/** ou ce workflow.
          # `backend` : même règle que `code` dans takibo-ci.yml. Quand la CI backend
          # s'exécute, son assemblage embarque déjà l'UI : le packaging n'est pas répété ici.
          # Aucun fichier détecté : rien n'est présumé, la chaîne frontend s'exécute.
          if [ -z "$changed" ] || grep -qE '^takibo-ui/|^\.github/workflows/takibo-ui-ci\.yml$' <<< "$changed"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun changement frontend : chaîne Node écartée."
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$changed" ] || grep -qvE '^docs/|\.md$|^takibo-ui/|^\.github/workflows/takibo-ui-ci\.yml$' <<< "$changed"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Takibo UI - Quality
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: takibo-ui

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: takibo-ui/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: Takibo UI - Playwright E2E
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: takibo-ui

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: takibo-ui/package-lock.json

      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            takibo-ui/playwright-report/
            takibo-ui/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Modification frontend seule : la CI backend est écartée, mais le JAR exécutable
  # embarque l'UI. Sans cette tâche, une rupture de l'embarquement (build Vite, bootJar)
  # ne serait détectée qu'après fusion. Elle ne lance aucun test backend.
  packaging:
    name: Takibo UI - Packaging
    needs: changes
    if: needs.changes.outputs.ui == 'true' && needs.changes.outputs.backend == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: takibo-ui/package-lock.json

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build executable JAR with embedded UI
        run: ./gradlew :takibo-iam-boot:bootJar --no-daemon --build-cache

      - name: Verify UI is embedded in the JAR
        run: |
          jar="$(find takibo-iam-boot/build/libs -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          [ -n "$jar" ] || { echo "No takibo-iam-boot jar found"; exit 1; }
          unzip -l "$jar" | grep -q 'BOOT-INF/classes/static/index.html' \
            || { echo "index.html absent du JAR"; exit 1; }

  status-check:
    name: Takibo UI CI Status
    needs:
      - changes
      - quality
      - e2e
      - packaging
    runs-on: ubuntu-latest
    if: always()
    permissions: {}

    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail

          failed=0

          check_result() {
            local job="$1"
            local result="$2"

            case "$result" in
              success|skipped)
                echo "$job: $result"
                ;;
              failure|cancelled)
                echo "$job: $result"
                failed=1
                ;;
              *)
                echo "$job: unexpected result '$result'"
                failed=1
                ;;
            esac
          }

          # `changes` décide seule d'écarter la chaîne : un résultat autre que success
          # ne peut pas être toléré, sinon toutes les tâches sautées passeraient pour vertes.
          if [ "${{ needs.changes.result }}" = "success" ]; then
            echo "changes: success (ui=${{ needs.changes.outputs.ui }}, backend=${{ needs.changes.outputs.backend }})"
          else
            echo "changes: ${{ needs.changes.result }}"
            failed=1
          fi

          check_result quality   "${{ needs.quality.result }}"
          check_result e2e       "${{ needs.e2e.result }}"
          check_result packaging "${{ needs.packaging.result }}"

          if [ "$failed" -eq 1 ]; then
            echo "Takibo UI CI status: FAILED"
            exit 1
          fi

          echo "Takibo UI CI status: PASSED"
