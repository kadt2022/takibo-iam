plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'Boot module for Takibu IAM monolithic app'

bootRun {
    jvmArgs = ['-Xdebug', '-Xrunjdwp:server=y,transport=dt_socket,address=5005,suspend=n']
    // Pas de profil forcé : bootRun démarre sur la datasource par défaut (application.yml).
    // Pour MySQL : ./gradlew :takibo-iam-boot:bootRun --args='--spring.profiles.active=mysql'
}

dependencies {
    implementation project(':takibo-identity-core')
    implementation project(':takibo-security-management')
    implementation project(':takibo-management-service')
    implementation project(':takibo-authorization-server')
    implementation project(':takibo-audit')
    implementation project(':takibo-security-context')
    implementation project(':takibo-security-context-spring')
    implementation project(':takibo-outbox-spring')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Security integration tests live in this executable module but exercise the
// filter chain implemented by takibo-security-management. Include those
// dependency classes in this module's report so Sonar can credit that coverage.
tasks.named('jacocoTestReport', JacocoReport) {
    additionalClassDirs.from(project(':takibo-security-management').sourceSets.main.output)
    additionalSourceDirs.from(project(':takibo-security-management').sourceSets.main.allSource.srcDirs)
}
