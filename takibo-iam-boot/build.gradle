plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'Boot module for Takibu IAM monolithic app'

bootRun {
    jvmArgs = ['-Xdebug', '-Xrunjdwp:server=y,transport=dt_socket,address=5005,suspend=n']
    // Pas de profil forcé : bootRun démarre sur la datasource par défaut (application.yml).
    // Pour MySQL : ./gradlew :takibo-iam-boot:bootRun --args='--spring.profiles.active=mysql'
}

// TAKIBO UI : le build Vite est embarqué dans le JAR exécutable (BOOT-INF/classes/static), servi
// par Spring Boot sur le même port que l'API. Node n'est jamais requis au lancement du JAR. Un
// échec npm fait échouer la construction. `--ignore-scripts` : exigence Sonar sur npm.
def uiDir = rootProject.layout.projectDirectory.dir('takibo-ui')
def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm'] : ['npm']

def uiInstall = tasks.register('uiInstall', Exec) {
    workingDir = uiDir
    commandLine npm + ['ci', '--ignore-scripts']
    inputs.files(uiDir.file('package.json'), uiDir.file('package-lock.json'))
    outputs.dir(uiDir.dir('node_modules'))
}

def uiBuild = tasks.register('uiBuild', Exec) {
    dependsOn uiInstall
    workingDir = uiDir
    commandLine npm + ['run', 'build']
    inputs.files(uiDir.file('package.json'), uiDir.file('package-lock.json'), uiDir.file('index.html'),
            uiDir.file('vite.config.ts'), uiDir.file('tsconfig.json'), uiDir.file('tsconfig.app.json'),
            uiDir.file('tsconfig.node.json'))
    inputs.dir(uiDir.dir('src'))
    inputs.dir(uiDir.dir('public'))
    outputs.dir(uiDir.dir('dist'))
}

// Où placer le build Vite, une seule fois dans le JAR dans les deux cas :
// - poste de développement : dans les ressources du module (static/), pour que l'application
//   lancée depuis l'IDE (Run d'IntelliJ délégué à Gradle) ou par bootRun serve aussi l'UI ;
// - CI (CI=true, posé par GitHub Actions) ou -PtakiboUiSkip : seul bootJar l'embarque, pour que
//   compiler et tester le backend n'exigent pas Node.
def uiInResources = System.getenv('CI') != 'true' && !project.hasProperty('takiboUiSkip')

if (uiInResources) {
    tasks.named('processResources') {
        from(uiBuild) { into 'static' }
    }
} else {
    tasks.named('bootJar') {
        from(uiBuild) { into 'BOOT-INF/classes/static' }
    }
}

dependencies {
    implementation project(':takibo-identity-core')
    implementation project(':takibo-security-management')
    implementation project(':takibo-management-service')
    implementation project(':takibo-authorization-server')
    implementation project(':takibo-audit')
    implementation project(':takibo-security-context')
    implementation project(':takibo-outbox')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.security:spring-security-oauth2-jose'
    // Preuve de l'activation de l'ADP dans l'application assemblée (déjà embarqué au runtime).
    testImplementation project(':takibo-adp')
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    // Filet de securite TAS-GRANTS-00 : PostgreSQL reel + migrations Flyway reelles.
    // H2 en mode PostgreSQL ne porte ni jsonb ni index uniques partiels.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // Le module TAS expose Spring Authorization Server en 'implementation' : ses types ne
    // fuient pas ici. Le filet doit pouvoir observer OAuth2AuthorizationService.
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
