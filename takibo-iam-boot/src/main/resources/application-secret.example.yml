spring:
  datasource:
    password:

  mail:
    host: smtp.gmail.com
    port: 587
    username: change-me
    password:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

takibo:
  # Secret du client OAuth de dev "postman-client" (grant client_credentials).
  # Requis au démarrage : application.yml référence ${TAKIBO_DEV_POSTMAN_SECRET} sans valeur par défaut.
  # En local, renseigne-le ici ; en CI il vient de la variable d'environnement.
  dev:
    postman-client:
      secret: change-me-dev-postman-secret
  messaging:
    catalog:
      messages:
        WELCOME_SPACE:
          from: no-reply@example.com
          recipients:
            - user@example.com
        AUDIT_SECURITY_ALERT:
          from: alerts@example.com
          recipients:
            - admin@example.com

