spring:
  datasource:
    password:

  mail:
    host: smtp.gmail.com
    port: 587
    username: change-me
    password:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

takibo:
  # Cles cryptographiques persistantes du TAS (TAS-GRANTS-02A / 02).
  # Valeurs generees par l'outil d'installation, jamais choisies manuellement, et jamais
  # ecrites en clair dans un exemple versionne. Le coeur refuse de demarrer si elles
  # manquent. En developpement et en CI, TAKIBO_TAS_EPHEMERAL_KEYS=true les remplace par
  # des cles regenerees a chaque demarrage.
  #
  # La cle de signature RSA ne figure pas ici : TAS l'amorce lui-meme au premier demarrage
  # (TAS-KEYS-BOOTSTRAP-01) et la conserve chiffree en base avec la cle AES ci-dessous.
  #
  # tas:
  #   keys:
  #     cipher:
  #       active-key-id: ${TAKIBO_TAS_CIPHER_KEY_ID}
  #       active-key: ${TAKIBO_TAS_CIPHER_KEY}
  #     user-code-hmac:
  #       key: ${TAKIBO_TAS_USER_CODE_HMAC_KEY}
  # Secret du client OAuth de dev "postman-client" (grant client_credentials).
  # Requis au démarrage : application.yml référence ${TAKIBO_DEV_POSTMAN_SECRET} sans valeur par défaut.
  # En local, renseigne-le ici ; en CI il vient de la variable d'environnement.
  dev:
    postman-client:
      secret: change-me-dev-postman-secret
  messaging:
    catalog:
      messages:
        WELCOME_SPACE:
          from: no-reply@example.com
          recipients:
            - user@example.com
        AUDIT_SECURITY_ALERT:
          from: alerts@example.com
          recipients:
            - admin@example.com

