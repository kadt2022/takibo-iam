spring:
  config:
    import: optional:classpath:application-secret.yml

  application:
    name: takibu-boot

  datasource:
    url: jdbc:postgresql://localhost:5432/takibo_iam
    username: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: hikari-iam
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate   # Hibernate NE CRÉE RIEN, il valide seulement
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
        jdbc.lob.non_contextual_creation: true
        naming:
          physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  jackson:
    time-zone: UTC

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
  show-actuator: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,beans,conditions,metrics,env,loggers
  endpoint:
    health:
      show-details: always

security:
  password-policy:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special-char: true
    max-age-days: 90
    history-size: 5

takibo:
  guard:
    space:
      whitelist:
        - /actuator/health
        - /actuator/info
        - /api/spaces/*/status
        - /api/spaces/signup
        - /api/spaces/signup/**
      fail-closed: true
      cache-ttl: 5s
      enabled: false
  audit:
    mode: COMPOSITE
    stores:
      - name: jpa
        enabled: true
      - name: file
        enabled: true
        params:
          filePath: ./audit-log-tiscore.log
  adp:
    enabled: true
    debugEnabled: false
    thresholds:
      deny-threshold: 75.0
      challenge-threshold: 40.0
      low-confidence-threshold: 0.5
    weights:
      location: 0.25
      time: 0.15
      device: 0.20
      behavior: 0.25
      network: 0.15
  outbox:
    enabled: true
    dead-letter-log-payload: false
    processor:
      scheduling-enabled: true
      fixed-delay: PT1S
      batch-size: 50
      max-attempts: 10
      locked-by: ${HOSTNAME:takibo-outbox}
      lock-timeout: PT5M
    backoff:
      type: exponential
      base-delay: PT1S
      max-delay: PT60S
      multiplier: 2
  space:
    provisioning:
      mode: messaging

  messaging:
    enabled: true
    processor:
      enabled: true
      fixed-delay: 2s
      batch-size: 50
      max-attempts: 10
      lock-timeout: 30s
      locked-by: "tms-1"
    backoff:
      type: exponential
      base-delay: 5s
      max-delay: 10m
      multiplier: 2

    catalog:
      messages:
        WELCOME_SPACE:
          channel: EMAIL
          subject: 'Welcome to ${spaceCode}'
          body: 'Space ${spaceName} is ready. SpaceId=${spaceId}'
        AUDIT_SECURITY_ALERT:
          channel: EMAIL
          subject: '[DEV ALERT] [${auditType}] - ${entityType}'
          body: |
            ALERTE SECURITE (API)
            --------------------
            Type: ${auditType}
            Entity: ${entityType} (ID: ${entityId})
            User: ${userId}
            IP: ${clientIp}
            TraceID: ${traceId}
