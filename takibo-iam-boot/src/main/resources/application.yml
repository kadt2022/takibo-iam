spring:
  config:
    import: optional:classpath:application-secret.yml

  application:
    name: takibu-boot

  datasource:
    url: jdbc:postgresql://localhost:5432/takibo_iam
    username: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: hikari-iam
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate   # Hibernate NE CRÉE RIEN, il valide seulement
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
        jdbc.lob.non_contextual_creation: true
        naming:
          physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  jackson:
    time-zone: UTC

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
  show-actuator: false

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,beans,conditions,metrics,env,loggers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      roles:
        - R_TAKIBO_PLATFORM_ADMIN

security:
  password-policy:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special-char: true
    max-age-days: 90
    history-size: 5

takibo:
  tas:
    issuer: http://localhost:8081
    keys:
      # Fail-closed par defaut. Sans cle de chiffrement, TAS refuse de demarrer plutot que
      # de proteger des secrets avec une valeur devinable : un defaut integre serait un
      # secret publie dans le depot.
      #
      # TAKIBO_TAS_CIPHER_KEY : 32 octets encodes en base64.
      # TAKIBO_TAS_CIPHER_KEY_ID : identifiant stable, [A-Za-z0-9_-], inscrit dans chaque
      #   chiffre. Ne jamais le reutiliser pour une autre matiere.
      #
      # La generation ephemere exige un opt-in explicite et n'a sa place qu'en
      # developpement ou en test : elle regenere une paire a chaque demarrage, donc
      # invalide tous les JWT en circulation a chaque deploiement.
      ephemeral: ${TAKIBO_TAS_EPHEMERAL_KEYS:false}
      cipher:
        active-key-id: ${TAKIBO_TAS_CIPHER_KEY_ID:}
        active-key: ${TAKIBO_TAS_CIPHER_KEY:}
      # Cle HMAC distincte de celle du chiffrement au repos ci-dessus : voir UserCodeHmac.
      # TAKIBO_TAS_USER_CODE_HMAC_KEY : 32 octets encodes en base64, jamais reutilises pour
      # le chiffrement. Meme regle ephemeral que ci-dessus en developpement/test.
      user-code-hmac:
        key: ${TAKIBO_TAS_USER_CODE_HMAC_KEY:}
  guard:
    space:
      whitelist:
        - /actuator/health
        - /actuator/info
        - /api/spaces/*/status
        - /api/spaces/signup
        - /api/spaces/signup/**
      fail-closed: true
      cache-ttl: 5s
      enabled: false
  audit:
    mode: COMPOSITE
    stores:
      - name: jpa
        enabled: true
      - name: file
        enabled: true
        params:
          filePath: ./audit-log-tiscore.log
  adp:
    enabled: true
    debugEnabled: false
    thresholds:
      deny-threshold: 75.0
      challenge-threshold: 40.0
      low-confidence-threshold: 0.5
    weights:
      location: 0.25
      time: 0.15
      device: 0.20
      behavior: 0.25
      network: 0.15
  outbox:
    enabled: true
    dead-letter-log-payload: false
    processor:
      scheduling-enabled: true
      fixed-delay: PT1S
      batch-size: 50
      max-attempts: 10
      locked-by: ${HOSTNAME:takibo-outbox}
      lock-timeout: PT5M
    backoff:
      type: exponential
      base-delay: PT1S
      max-delay: PT60S
      multiplier: 2
  space:
    provisioning:
      mode: messaging

  messaging:
    enabled: true
    processor:
      enabled: true
      fixed-delay: 2s
      batch-size: 50
      max-attempts: 10
      lock-timeout: 30s
      locked-by: "tms-1"
    backoff:
      type: exponential
      base-delay: 5s
      max-delay: 10m
      multiplier: 2

    catalog:
      messages:
        WELCOME_SPACE:
          channel: EMAIL
          subject: 'Welcome to ${spaceCode}'
          body: 'Space ${spaceName} is ready. SpaceId=${spaceId}'
        AUDIT_SECURITY_ALERT:
          channel: EMAIL
          subject: '[DEV ALERT] [${auditType}] - ${entityType}'
          body: |
            ALERTE SECURITE (API)
            --------------------
            Type: ${auditType}
            Entity: ${entityType} (ID: ${entityId})
            User: ${userId}
            IP: ${clientIp}
            TraceID: ${traceId}

  dev:
    postman-client:
      secret: ${TAKIBO_DEV_POSTMAN_SECRET}
