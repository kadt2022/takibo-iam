spring:
  datasource:
    url: jdbc:h2:mem:takibo_iam_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none

takibo:
  dev:
    postman-client:
      secret: test-ci-secret-placeholder
  messaging:
    processor:
      enabled: false
  outbox:
    processor:
      scheduling-enabled: false
